# Deploys to Fly.io on every push to main.
# Requires the FLY_API_TOKEN repo secret: `fly tokens create deploy -x 999999h`
name: Fly Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual re-deploys from the Actions tab

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Builds on Fly's remote builder using the Dockerfile and fly.toml [build.args].
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
